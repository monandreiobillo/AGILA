<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGILA</title>
<style>
:root{--red:#B91C1C;--red-dark:#991B1B}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;background:#FAFAFA;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.btn{display:flex;align-items:center;justify-content:center;width:min(100% - 40px,390px);min-height:50px;padding:12px 20px;
  border:1.5px solid transparent;border-radius:999px;background:var(--red);color:#fff;font-size:16px;font-weight:650;
  text-decoration:none;transition:background .15s}
.btn:hover{background:var(--red-dark)}
.btn:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 5px var(--red);border-radius:999px}
</style>
</head>
<body>

</body>
