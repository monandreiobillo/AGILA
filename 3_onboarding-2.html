<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAFAFA">
  <title>Project AGILA | Personalize Your Experience</title>
  <style>
    :root {
      --background: #FAFAFA;
      --card: #FFFFFF;
      --primary: #B91C1C;
      --burgundy: #6B2528;
      --pale-rose: #FDE7E7;
      --text: #1F2937;
      --secondary: #6B7280;
      --border: #E5E7EB;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      min-height: 100%;
      background: var(--background);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .header {
      flex: 0 0 auto;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--burgundy);
      font-size: 18px;
      font-weight: 750;
      letter-spacing: 0.8px;
      line-height: 27px;
    }

    .wordmark-symbol {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border: 2px solid var(--primary);
      border-radius: 50% 50% 50% 8px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
    }

    .progress-area {
      margin-top: 34px;
    }

    .progress-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .progress-label,
    .step-label {
      font-size: 12px;
    }

    .progress-label {
      color: var(--secondary);
      font-weight: 600;
    }

    .step-label {
      flex-shrink: 0;
      color: var(--burgundy);
      font-weight: 650;
    }

    .progress-track {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }

    .progress-segment {
      height: 4px;
      border-radius: 99px;
      background: var(--border);
    }

    .progress-segment.active {
      background: var(--primary);
    }

    main {
      flex: 1 0 auto;
      padding-top: 30px;
    }

    .intro {
      margin-bottom: 24px;
    }

    h1 {
      max-width: 340px;
      margin: 0;
      color: var(--text);
      font-size: 26px;
      font-weight: 750;
      letter-spacing: -0.75px;
      line-height: 1.24;
    }

    .helper {
      max-width: 345px;
      margin: 10px 0 0;
      color: var(--secondary);
      font-size: 14px;
      line-height: 1.55;
    }

    .options-form {
      margin: 0;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .option-list {
      display: grid;
      gap: 10px;
    }

    .option {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease;
    }

    .option:hover {
      border-color: #D1A3A3;
      background: #FFFAFA;
    }

    .option:has(input:checked) {
      border-color: var(--primary);
      background: var(--pale-rose);
    }

    .option input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .checkbox-indicator {
      display: grid;
      flex: 0 0 20px;
      width: 20px;
      height: 20px;
      place-items: center;
      border: 1.5px solid #9CA3AF;
      border-radius: 5px;
      background: #FFFFFF;
      color: #FFFFFF;
    }

    .checkbox-indicator svg {
      width: 14px;
      height: 14px;
      opacity: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .option input:checked + .checkbox-indicator {
      border-color: var(--primary);
      background: var(--primary);
    }

    .option input:checked + .checkbox-indicator svg {
      opacity: 1;
    }

    .option input:focus-visible + .checkbox-indicator {
      outline: 3px solid #FCA5A5;
      outline-offset: 3px;
    }

    .option input:focus-visible ~ .option-text {
      text-decoration: underline;
      text-decoration-color: var(--primary);
      text-underline-offset: 3px;
    }

    .option-text {
      min-width: 0;
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .option input:checked ~ .option-text {
      font-weight: 600;
    }

    .bottom-actions {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 24px;
    }

    .continue-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      padding: 13px 20px;
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 650;
      line-height: 24px;
      cursor: pointer;
    }

    .continue-button:hover {
      background: #991B1B;
    }

    .continue-button:focus-visible,
    .skip-button:focus-visible {
      outline: 3px solid #FCA5A5;
      outline-offset: 4px;
    }

    .skip-button {
      align-self: center;
      min-height: 28px;
      padding: 2px 12px;
      border: 0;
      background: transparent;
      color: var(--secondary);
      font-size: 14px;
      font-weight: 550;
      line-height: 24px;
      text-align: center;
      cursor: pointer;
    }

    .skip-button:hover {
      color: var(--burgundy);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (min-width: 391px) {
      .page {
        padding-right: 24px;
        padding-left: 24px;
      }
    }

    @media (max-width: 360px) {
      .page {
        padding: 20px 16px;
      }

      .progress-area {
        margin-top: 28px;
      }

      main {
        padding-top: 24px;
      }

      h1 {
        font-size: 25px;
      }

      .intro {
        margin-bottom: 20px;
      }

      .option-list {
        gap: 8px;
      }

      .option {
        min-height: 50px;
        padding: 12px;
      }

      .bottom-actions {
        margin-top: 18px;
      }
    }

    @media (max-height: 760px) {
      .page {
        min-height: 760px;
        padding-top: 18px;
        padding-bottom: 18px;
      }

      .progress-area {
        margin-top: 24px;
      }

      main {
        padding-top: 22px;
      }

      .intro {
        margin-bottom: 16px;
      }

      .option-list {
        gap: 8px;
      }

      .option {
        min-height: 46px;
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .bottom-actions {
        margin-top: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="wordmark" aria-label="AGILA">
        <span class="wordmark-symbol" aria-hidden="true">A</span>
        <span>AGILA</span>
      </div>

      <div class="progress-area">
        <div class="progress-topline">
          <span class="progress-label">Personalize your experience</span>
          <span class="step-label">Step 2 of 5</span>
        </div>

        <div
          class="progress-track"
          role="progressbar"
          aria-label="Onboarding progress"
          aria-valuemin="1"
          aria-valuemax="5"
          aria-valuenow="2"
        >
          <span class="progress-segment active"></span>
          <span class="progress-segment active"></span>
          <span class="progress-segment"></span>
          <span class="progress-segment"></span>
          <span class="progress-segment"></span>
        </div>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">Would any of these apply to you?</h1>
        <p class="helper">
          Some processes have specific guidance for certain groups. Choose any that apply, or skip.
        </p>
      </section>

      <form class="options-form" action="#" method="get">
        <fieldset aria-label="Optional personal context">
          <div class="option-list">
            <label class="option">
              <input type="checkbox" name="context" value="pwd">
              <span class="checkbox-indicator" aria-hidden="true">
                <svg viewBox="0 0 16 16">
                  <path d="m3 8 3.2 3.2L13 4.5"></path>
                </svg>
              </span>
              <span class="option-text">Person with disability (PWD)</span>
            </label>

            <label class="option">
              <input type="checkbox" name="context" value="senior-citizen">
              <span class="checkbox-indicator" aria-hidden="true">
                <svg viewBox="0 0 16 16">
                  <path d="m3 8 3.2 3.2L13 4.5"></path>
                </svg>
              </span>
              <span class="option-text">Senior citizen</span>
            </label>

            <label class="option">
              <input type="checkbox" name="context" value="solo-parent">
              <span class="checkbox-indicator" aria-hidden="true">
                <svg viewBox="0 0 16 16">
                  <path d="m3 8 3.2 3.2L13 4.5"></path>
                </svg>
              </span>
              <span class="option-text">Solo Parent</span>
            </label>

            <label class="option">
              <input type="checkbox" name="context" value="not-applicable">
              <span class="checkbox-indicator" aria-hidden="true">
                <svg viewBox="0 0 16 16">
                  <path d="m3 8 3.2 3.2L13 4.5"></path>
                </svg>
              </span>
              <span class="option-text">Not applicable</span>
            </label>
          </div>
        </fieldset>
      </form>
    </main>

    <footer class="bottom-actions">
      <button class="continue-button" type="button">Continue</button>
      <button class="skip-button" type="button">Skip for now</button>
    </footer>
  </div>
</body>
</html>
