<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project AGILA | Welcome</title>
  <style>
    :root {
      --background: #FAFAFA;
      --primary-red: #B91C1C;
      --burgundy: #6B2528;
      --pale-rose: #FDE7E7;
      --primary-text: #1F2937;
      --secondary-text: #6B7280;
      --border: #E5E7EB;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      min-height: 100%;
      background: var(--background);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--background);
      color: var(--primary-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .welcome-screen {
      width: 100%;
      max-width: 342px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 76px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      min-height: 48px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-mark svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .brand-name {
      margin: 0;
      color: var(--burgundy);
      font-size: 30px;
      font-weight: 750;
      letter-spacing: -1.2px;
      line-height: 1;
    }

    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-button {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      min-height: 52px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 999px;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition:
        background-color 160ms ease,
        border-color 160ms ease,
        color 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .action-button:focus-visible {
      outline: 3px solid var(--burgundy);
      outline-offset: 4px;
    }

    .action-button:active {
      transform: scale(0.99);
    }

    .action-primary {
      background: var(--primary-red);
      border-color: var(--primary-red);
      color: var(--white);
    }

    .action-primary:hover {
      background: #991B1B;
      border-color: #991B1B;
    }

    .action-secondary {
      background: var(--white);
      border-color: var(--primary-red);
      color: var(--primary-red);
    }

    .action-secondary:hover {
      background: #FFF5F5;
    }

    .action-guest {
      background: var(--pale-rose);
      border-color: var(--pale-rose);
      color: var(--burgundy);
    }

    .action-guest:hover {
      background: #FBDADA;
      border-color: #FBDADA;
    }

    @media (max-width: 360px) {
      body {
        padding: 20px;
      }

      .welcome-screen {
        gap: 64px;
      }
    }

    @media (max-height: 560px) {
      body {
        align-items: flex-start;
      }

      .welcome-screen {
        margin: 24px auto;
        gap: 40px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .action-button {
        transition: none;
      }

      .action-button:active {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="welcome-screen" aria-label="Project AGILA welcome screen">
    <div class="brand" aria-label="AGILA">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M5 29.5C12.2 27.9 17.4 23.6 21.4 15.2C23.3 22.1 29.2 25.8 40.8 23.8C36.7 29.1 31.1 32.1 24.6 31.6C19.2 31.2 14.1 29.9 9.3 32.9L5 29.5Z"
            fill="#B91C1C"
          />
          <path
            d="M19.5 27.2C23.5 29.3 28.7 29.4 34.1 27.3C30.6 34.1 24.9 38.2 17.7 38.2C14.9 38.2 12.5 37.6 10.3 36.3C14.3 34.7 17.3 31.5 19.5 27.2Z"
            fill="#6B2528"
          />
          <path
            d="M21.4 15.2L26.1 20.7L37.8 19.3L40.8 23.8C29.2 25.8 23.3 22.1 21.4 15.2Z"
            fill="#8F1D24"
          />
        </svg>
      </div>
      <p class="brand-name">AGILA</p>
    </div>

    <div class="actions" aria-label="Account options">
      <button class="action-button action-primary" type="button">
        Sign in
      </button>

      <button class="action-button action-secondary" type="button">
        Create an account
      </button>

      <button class="action-button action-guest" type="button">
        Continue as guest
      </button>
    </div>
  </main>
</body>
</html>
