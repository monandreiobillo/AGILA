<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAFAFA">
  <title>AGILA | Home</title>
  <style>
    :root {
      color-scheme: light;
      --background: #FAFAFA;
      --surface: #FFFFFF;
      --primary: #B91C1C;
      --burgundy: #6B2528;
      --pale-rose: #FDE7E7;
      --text: #1F2937;
      --secondary: #6B7280;
      --border: #E5E7EB;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--background);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    button,
    textarea {
      font: inherit;
    }

    button:focus-visible,
    textarea:focus-visible,
    a:focus-visible {
      outline: 3px solid #E8A0A0;
      outline-offset: 3px;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding-bottom: 88px;
      background: var(--background);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 56px;
      flex-shrink: 0;
      padding: 0 20px;
      background: var(--background);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--burgundy);
      font-size: 20px;
      font-weight: 750;
      letter-spacing: -0.6px;
      text-decoration: none;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: var(--pale-rose);
      color: var(--primary);
    }

    .brand-mark svg {
      width: 21px;
      height: 21px;
    }

    main {
      flex: 1;
      padding: 23px 20px 24px;
    }

    .intro {
      margin-bottom: 17px;
    }

    h1 {
      max-width: 320px;
      margin: 0;
      color: var(--text);
      font-size: 28px;
      font-weight: 750;
      line-height: 1.2;
      letter-spacing: -0.85px;
    }

    .helper {
      max-width: 330px;
      margin: 10px 0 0;
      color: var(--secondary);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }

    .query-form {
      display: flex;
      flex-direction: column;
      gap: 13px;
      margin: 0;
    }

    .query-field {
      display: flex;
      flex-direction: column;
      min-height: 116px;
      padding: 13px 14px 10px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .query-field:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgb(185 28 28 / 8%);
    }

    .field-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .field-label {
      color: var(--secondary);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.5px;
    }

    .expand-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 27px;
      padding: 4px 7px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--secondary);
      font-size: 11px;
      font-weight: 550;
      cursor: pointer;
    }

    .expand-button:hover {
      background: #F3F4F6;
      color: var(--primary);
    }

    .expand-button svg {
      width: 14px;
      height: 14px;
      transition: transform 150ms ease;
    }

    .query-field.expanded .expand-button svg {
      transform: rotate(180deg);
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 46px;
      flex: 1;
      resize: vertical;
      padding: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      font-weight: 450;
      line-height: 1.5;
    }

    textarea:focus-visible {
      outline: none;
    }

    .query-field.expanded textarea {
      min-height: 150px;
    }

    .build-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 52px;
      padding: 0 18px;
      border: none;
      border-radius: 999px;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    .build-button svg {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
    }

    .build-button:hover {
      background: #991B1B;
    }

    .build-button:active {
      transform: scale(0.99);
    }

    .common-section {
      margin-top: 27px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-heading h2 {
      margin: 0;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .section-caption {
      color: var(--secondary);
      font-size: 11px;
      white-space: nowrap;
    }

    .process-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .process-card {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 62px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease;
    }

    .process-card:hover {
      border-color: #E5B5B5;
      background: #FFFCFC;
    }

    .process-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 39px;
      height: 39px;
      flex-shrink: 0;
      border-radius: 11px;
      background: var(--pale-rose);
      color: var(--burgundy);
    }

    .process-icon svg {
      width: 21px;
      height: 21px;
    }

    .process-info {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .process-name {
      color: var(--text);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.35;
    }

    .process-description {
      color: var(--secondary);
      font-size: 11px;
      line-height: 1.35;
    }

    .process-chevron {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      color: var(--secondary);
    }

    .bottom-nav {
      position: fixed;
      z-index: 10;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      width: 100%;
      max-width: 480px;
      min-height: 76px;
      margin: 0 auto;
      padding: 9px 8px max(9px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-width: 0;
      padding: 2px 0;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--secondary);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-item svg {
      display: block;
      width: 21px;
      height: 21px;
      flex-shrink: 0;
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: 650;
    }

    .nav-item.active .nav-icon-wrap {
      background: var(--pale-rose);
    }

    .nav-icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 47px;
      height: 28px;
      border-radius: 999px;
    }

    @media (min-width: 481px) {
      .bottom-nav {
        right: auto;
        left: 50%;
        transform: translateX(-50%);
      }
    }

    @media (max-width: 360px) {
      main {
        padding-right: 16px;
        padding-left: 16px;
      }

      .header {
        padding-right: 16px;
        padding-left: 16px;
      }

      h1 {
        font-size: 27px;
      }

      .process-card {
        gap: 9px;
        padding-right: 9px;
        padding-left: 9px;
      }

      .process-name {
        font-size: 12px;
      }

      .process-description {
        font-size: 10px;
      }

      .nav-item {
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="brand" href="#" aria-label="AGILA home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 16.5 9 6l3 6 2-3 6 7.5H4Z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"/>
            <path d="m8 16.5 4-4.5 4 4.5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"/>
          </svg>
        </span>
        <span>AGILA</span>
      </a>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">What do you need help with?</h1>
        <p class="helper">
          Describe your goal in your own words. We’ll help you map out the next steps.
        </p>
      </section>

      <form class="query-form" aria-label="Government-service goal">
        <div class="query-field" id="query-field">
          <div class="field-top">
            <label class="field-label" for="goal">YOUR GOAL</label>
            <button
              class="expand-button"
              id="expand-button"
              type="button"
              aria-controls="goal"
              aria-expanded="false"
              aria-label="Expand goal text box"
            >
              <span id="expand-label">Expand</span>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m6 9 6 6 6-6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
              </svg>
            </button>
          </div>

          <textarea
            id="goal"
            name="goal"
            rows="2"
            aria-label="Describe your government-service goal"
            spellcheck="true"
          >Just graduated and plan on applying for jobs</textarea>
        </div>

        <button class="build-button" type="button">
          <span>Build my roadmap</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4.5 12h14m-6-6 6 6-6 6"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"/>
          </svg>
        </button>
      </form>

      <section class="common-section" aria-labelledby="common-title">
        <div class="section-heading">
          <h2 id="common-title">Suggested government processes</h2>
          <span class="section-caption">Get started</span>
        </div>

        <div class="process-list">
          <button class="process-card" type="button">
            <span class="process-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <rect x="4" y="3.5" width="16" height="17" rx="2"
                  stroke="currentColor" stroke-width="1.7"/>
                <circle cx="12" cy="9" r="2.5"
                  stroke="currentColor" stroke-width="1.6"/>
                <path d="M7.5 17c.5-2.1 2-3.2 4.5-3.2s4 1.1 4.5 3.2"
                  stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round"/>
              </svg>
            </span>
            <span class="process-info">
              <span class="process-name">Get a government ID</span>
              <span class="process-description">Explore identification and registration requirements</span>
            </span>
            <svg class="process-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m9 5 7 7-7 7"
                stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button class="process-card" type="button">
            <span class="process-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 20V7l8-4 8 4v13H4Z"
                  stroke="currentColor" stroke-width="1.7"
                  stroke-linejoin="round"/>
                <path d="M8 20v-5h8v5M8 9h.01M12 9h.01M16 9h.01"
                  stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="process-info">
              <span class="process-name">Apply for government benefits</span>
              <span class="process-description">Understand applications and supporting documents</span>
            </span>
            <svg class="process-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m9 5 7 7-7 7"
                stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button class="process-card" type="button">
            <span class="process-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <rect x="4" y="5" width="16" height="15" rx="2"
                  stroke="currentColor" stroke-width="1.7"/>
                <path d="M8 3v4M16 3v4M4 10h16M8 14h3M8 17h6"
                  stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round"/>
              </svg>
            </span>
            <span class="process-info">
              <span class="process-name">Request a civil registry document</span>
              <span class="process-description">Find out how to request a birth or marriage certificate</span>
            </span>
            <svg class="process-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m9 5 7 7-7 7"
                stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button class="process-card" type="button">
            <span class="process-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M5 20V8l7-4 7 4v12H5Z"
                  stroke="currentColor" stroke-width="1.7"
                  stroke-linejoin="round"/>
                <path d="M9 20v-5h6v5M9 10h.01M12 10h.01M15 10h.01"
                  stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="process-info">
              <span class="process-name">Register or update government records</span>
              <span class="process-description">Review common registration and record-update steps</span>
            </span>
            <svg class="process-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m9 5 7 7-7 7"
                stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" type="button" aria-current="page">
        <span class="nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m3.5 10 8.5-7 8.5 7v9.5h-6v-6h-5v6h-6V10Z"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"/>
          </svg>
        </span>
        <span>Home</span>
      </button>

      <button class="nav-item" type="button">
        <span class="nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 4.5h12v15H6v-15Z"
              stroke="currentColor" stroke-width="1.7"
              stroke-linejoin="round"/>
            <path d="M9 9h6M9 12.5h6M9 16h4"
              stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round"/>
          </svg>
        </span>
        <span>My roadmaps</span>
      </button>

      <button class="nav-item" type="button">
        <span class="nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7"
              stroke="currentColor" stroke-width="1.7"/>
            <path d="m16 16 4.5 4.5M8 11h6M11 8v6"
              stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round"/>
          </svg>
        </span>
        <span>Explore</span>
      </button>

      <button class="nav-item" type="button">
        <span class="nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5"
              stroke="currentColor" stroke-width="1.7"/>
            <path d="M5 20c.5-3.6 3.2-5.5 7-5.5s6.5 1.9 7 5.5"
              stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round"/>
          </svg>
        </span>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <script>
    // Prototype-only interaction for expanding the goal text area.
    const queryField = document.getElementById("query-field");
    const expandButton = document.getElementById("expand-button");
    const expandLabel = document.getElementById("expand-label");
    const goal = document.getElementById("goal");

    expandButton.addEventListener("click", () => {
      const expanded = queryField.classList.toggle("expanded");

      expandButton.setAttribute("aria-expanded", String(expanded));
      expandButton.setAttribute(
        "aria-label",
        expanded ? "Collapse goal text box" : "Expand goal text box"
      );
      expandLabel.textContent = expanded ? "Collapse" : "Expand";
      goal.rows = expanded ? 7 : 2;
    });
  </script>
</body>
</html>
