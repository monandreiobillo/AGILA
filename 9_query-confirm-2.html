<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAFAFA">
  <title>AGILA | Existing Requirements</title>
  <style>
    :root {
      color-scheme: light;
      --background: #FAFAFA;
      --surface: #FFFFFF;
      --primary: #B91C1C;
      --burgundy: #6B2528;
      --pale-rose: #FDE7E7;
      --text: #1F2937;
      --secondary: #6B7280;
      --border: #E5E7EB;
      --focus: #991B1B;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      min-height: 100%;
      background: var(--background);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 0 20px;
    }

    .topbar {
      display: flex;
      align-items: center;
      height: 64px;
      flex-shrink: 0;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      margin-left: -8px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }

    .back-button svg {
      width: 22px;
      height: 22px;
    }

    .wordmark {
      margin-left: 8px;
      color: var(--burgundy);
      font-size: 18px;
      font-weight: 750;
      letter-spacing: 0.3px;
    }

    .content {
      padding-top: 35px;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.7px;
      line-height: 1.4;
    }

    h1 {
      max-width: 350px;
      margin: 0;
      color: var(--text);
      font-size: 26px;
      font-weight: 750;
      line-height: 1.2;
      letter-spacing: -0.65px;
    }

    .helper {
      max-width: 340px;
      margin: 14px 0 28px;
      color: var(--secondary);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0;
      padding: 0;
      border: 0;
      min-width: 0;
    }

    .option {
      position: relative;
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 88px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      cursor: pointer;
      transition: border-color 140ms ease, background-color 140ms ease;
    }

    .option:has(input:checked) {
      border: 1.5px solid var(--primary);
      background: #FFF8F8;
    }

    .option:has(input:focus-visible) {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .radio {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      border: 1.5px solid #D1D5DB;
      border-radius: 50%;
      background: var(--surface);
    }

    .option input {
      position: absolute;
      width: 20px;
      height: 20px;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .option input:checked + .radio {
      border-color: var(--primary);
    }

    .option input:checked + .radio::after {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      content: "";
    }

    .option-copy {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .option-title {
      color: var(--text);
      font-size: 15px;
      font-weight: 650;
      line-height: 1.35;
    }

    .option-description {
      color: var(--secondary);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.45;
    }

    .bottom {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: auto;
      padding-top: 32px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }

    .continue-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      padding: 14px 20px;
      border: none;
      border-radius: 999px;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 650;
      line-height: 1.4;
      cursor: pointer;
      transition: background-color 140ms ease;
    }

    .continue-button:hover {
      background: #991B1B;
    }

    .back-button:focus-visible,
    .continue-button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    @media (max-width: 360px) {
      .screen {
        padding-right: 16px;
        padding-left: 16px;
      }

      .content {
        padding-top: 25px;
      }

      h1 {
        font-size: 25px;
      }

      .helper {
        margin-bottom: 24px;
      }

      .option {
        gap: 11px;
        padding: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="screen">
    <header class="topbar">
      <button
        class="back-button"
        type="button"
        aria-label="Go back"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M19 12H5"></path>
          <path d="m12 19-7-7 7-7"></path>
        </svg>
      </button>
      <span class="wordmark">AGILA</span>
    </header>

    <section class="content" aria-labelledby="page-title">
      <p class="eyebrow">Let’s clarify your goal</p>

      <h1 id="page-title">
        Do you already have a list of requirements from your target employer?
      </h1>

      <p class="helper" id="question-help">
        We can use your list as a starting point, or help you begin with general guidance.
      </p>

      <form id="requirements-form">
        <fieldset class="options" aria-describedby="question-help">
          <legend style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">
            Existing employer requirements
          </legend>

          <label class="option">
            <input
              type="radio"
              name="requirements"
              value="yes"
              aria-label="Yes, I have a list"
            >
            <span class="radio" aria-hidden="true"></span>
            <span class="option-copy">
              <span class="option-title">Yes, I have a list</span>
              <span class="option-description">
                I want to start with the requirements I was given.
              </span>
            </span>
          </label>

          <label class="option">
            <input
              type="radio"
              name="requirements"
              value="no"
              aria-label="No, not yet"
            >
            <span class="radio" aria-hidden="true"></span>
            <span class="option-copy">
              <span class="option-title">No, not yet</span>
              <span class="option-description">
                Help me understand what I may need to prepare.
              </span>
            </span>
          </label>
        </fieldset>

        <div class="bottom">
          <button class="continue-button" type="button">
            Continue
          </button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
