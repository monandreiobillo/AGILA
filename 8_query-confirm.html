<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAFAFA">
  <title>AGILA | Clarify Employment Sector</title>
  <style>
    :root {
      color-scheme: light;
      --background: #FAFAFA;
      --card: #FFFFFF;
      --primary: #B91C1C;
      --burgundy: #6B2528;
      --pale-rose: #FDE7E7;
      --text: #1F2937;
      --secondary: #6B7280;
      --border: #E5E7EB;
      --focus: #B91C1C;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .back-button {
      width: 40px;
      height: 40px;
      margin-left: -8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }

    .back-button svg {
      width: 22px;
      height: 22px;
    }

    .wordmark {
      color: var(--burgundy);
      font-size: 18px;
      font-weight: 750;
      letter-spacing: 0.4px;
    }

    .wordmark span {
      color: var(--primary);
    }

    .content {
      flex: 1;
      padding-top: 20px;
      padding-bottom: 24px;
    }

    .progress-label {
      margin: 0 0 12px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.2px;
    }

    h1 {
      margin: 0;
      max-width: 350px;
      color: var(--text);
      font-size: 26px;
      line-height: 1.25;
      font-weight: 750;
      letter-spacing: -0.65px;
    }

    .helper {
      margin: 12px 0 26px;
      max-width: 340px;
      color: var(--secondary);
      font-size: 14px;
      line-height: 1.55;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0;
      padding: 0;
      border: 0;
      min-width: 0;
    }

    .options legend {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .option {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 78px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      cursor: pointer;
      transition: border-color 150ms ease, background-color 150ms ease;
    }

    .option:hover {
      border-color: #D1A0A0;
    }

    .option:has(input:checked) {
      border: 1.5px solid var(--primary);
      padding: 15.5px;
      background: #FFF9F9;
    }

    .option:has(input:focus-visible) {
      outline: 3px solid rgba(185, 28, 28, 0.28);
      outline-offset: 3px;
    }

    .radio {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      border: 1.5px solid #9CA3AF;
      border-radius: 50%;
      background: #FFFFFF;
    }

    .option input {
      position: absolute;
      width: 21px;
      height: 21px;
      opacity: 0;
      cursor: pointer;
    }

    .option input:checked + .radio {
      border: 2px solid var(--primary);
    }

    .option input:checked + .radio::after {
      content: "";
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--primary);
    }

    .option-copy {
      display: flex;
      flex: 1;
      min-width: 0;
      flex-direction: column;
      gap: 5px;
    }

    .option-title {
      color: var(--text);
      font-size: 16px;
      font-weight: 650;
      line-height: 1.3;
    }

    .option-description {
      color: var(--secondary);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.45;
    }

    .note {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-top: 24px;
      padding: 13px 14px;
      border-radius: 12px;
      background: #F5F5F5;
      color: var(--secondary);
      font-size: 12px;
      line-height: 1.5;
    }

    .note svg {
      width: 16px;
      height: 16px;
      margin-top: 1px;
      flex-shrink: 0;
      color: var(--burgundy);
    }

    .bottom-action {
      flex-shrink: 0;
      padding-top: 16px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      background: var(--background);
    }

    .continue-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      padding: 14px 20px;
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 650;
      line-height: 1.4;
      cursor: pointer;
    }

    .continue-button:focus-visible,
    .back-button:focus-visible {
      outline: 3px solid rgba(185, 28, 28, 0.35);
      outline-offset: 3px;
    }

    @media (max-width: 360px) {
      .screen {
        padding-right: 16px;
        padding-left: 16px;
      }

      .content {
        padding-top: 14px;
      }

      h1 {
        font-size: 25px;
      }

      .helper {
        margin-bottom: 22px;
      }

      .option {
        gap: 11px;
        padding: 14px;
      }

      .option:has(input:checked) {
        padding: 13.5px;
      }

      .bottom-action {
        padding-top: 12px;
      }
    }

    @media (max-height: 700px) {
      .topbar {
        height: 56px;
      }

      .content {
        padding-top: 10px;
        padding-bottom: 12px;
      }

      .helper {
        margin-bottom: 18px;
      }

      .option {
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .option:has(input:checked) {
        padding-top: 11.5px;
        padding-bottom: 11.5px;
      }

      .note {
        margin-top: 16px;
      }

      .bottom-action {
        padding-top: 10px;
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="screen">
    <header class="topbar">
      <button class="back-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="wordmark" aria-label="AGILA">AGI<span>LA</span></div>
    </header>

    <section class="content" aria-labelledby="page-title">
      <p class="progress-label">Let’s clarify your goal</p>

      <h1 id="page-title">What kind of employer are you applying to?</h1>

      <p class="helper" id="sector-helper">
        This can change which requirements or offices may be relevant.
      </p>

      <fieldset class="options" aria-describedby="sector-helper">
        <legend>Choose an employer sector</legend>

        <label class="option">
          <input type="radio" name="employment-sector" value="private">
          <span class="radio" aria-hidden="true"></span>
          <span class="option-copy">
            <span class="option-title">Private sector</span>
            <span class="option-description">Applying to a private company or organization.</span>
          </span>
        </label>

        <label class="option">
          <input type="radio" name="employment-sector" value="public">
          <span class="radio" aria-hidden="true"></span>
          <span class="option-copy">
            <span class="option-title">Public sector</span>
            <span class="option-description">Applying to a government office or public institution.</span>
          </span>
        </label>

        <label class="option">
          <input type="radio" name="employment-sector" value="unsure">
          <span class="radio" aria-hidden="true"></span>
          <span class="option-copy">
            <span class="option-title">I’m not sure yet</span>
            <span class="option-description">Help me start with general guidance.</span>
          </span>
        </label>
      </fieldset>

      <aside class="note">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 11v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <circle cx="12" cy="8" r="1" fill="currentColor"/>
        </svg>
        <span>You can review your answers before the roadmap is generated.</span>
      </aside>
    </section>

    <footer class="bottom-action">
      <button class="continue-button" type="button">Continue</button>
    </footer>
  </main>
</body>
</html>
