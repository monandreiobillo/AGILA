<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGILA | Location Preference</title>
  <style>
    :root {
      color-scheme: light;
      --background: #FAFAFA;
      --surface: #FFFFFF;
      --primary: #B91C1C;
      --burgundy: #6B2528;
      --pale-rose: #FDE7E7;
      --text: #1F2937;
      --secondary: #6B7280;
      --border: #E5E7EB;
      --focus: #991B1B;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 20px 24px;
      display: flex;
      flex-direction: column;
    }

    .brand {
      margin: 0;
      color: var(--burgundy);
      font-size: 18px;
      line-height: 24px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .progress-area {
      margin-top: 28px;
    }

    .progress-label {
      margin: 0;
      color: var(--secondary);
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 9px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .progress-meta strong {
      color: var(--text);
      font-weight: 600;
    }

    .progress-meta span {
      color: var(--secondary);
    }

    .progress-track {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }

    .progress-segment {
      height: 4px;
      border-radius: 99px;
      background: var(--border);
    }

    .progress-segment.active {
      background: var(--primary);
    }

    .intro {
      margin-top: 25px;
      margin-bottom: 19px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.25;
      letter-spacing: -0.7px;
      font-weight: 750;
    }

    .intro p {
      max-width: 340px;
      margin: 8px 0 0;
      color: var(--secondary);
      font-size: 14px;
      line-height: 1.5;
    }

    .selection-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 62px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      cursor: pointer;
      transition: border-color 120ms ease, background-color 120ms ease;
    }

    .choice:has(input:checked) {
      border-color: var(--primary);
      background: #FFF8F8;
    }

    .choice:focus-within {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .choice input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      flex: 0 0 19px;
      width: 19px;
      height: 19px;
      margin: 0;
      border: 1.5px solid #9CA3AF;
      border-radius: 50%;
      background: var(--surface);
      cursor: pointer;
    }

    .choice input[type="radio"]:checked {
      border: 5px solid var(--primary);
    }

    .choice input[type="radio"]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .choice-copy {
      min-width: 0;
      flex: 1;
    }

    .choice-title {
      display: block;
      color: var(--text);
      font-size: 15px;
      line-height: 20px;
      font-weight: 600;
    }

    .choice-description {
      display: block;
      margin-top: 2px;
      color: var(--secondary);
      font-size: 12px;
      line-height: 17px;
    }

    .city-field {
      margin-top: 14px;
    }

    .city-field label {
      display: block;
      margin-bottom: 7px;
      color: var(--text);
      font-size: 13px;
      line-height: 18px;
      font-weight: 600;
    }

    .city-field input {
      display: block;
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }

    .city-field input::placeholder {
      color: #9CA3AF;
      opacity: 1;
    }

    .city-field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--pale-rose);
    }

    .actions {
      margin-top: auto;
      padding-top: 24px;
    }

    .primary-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      padding: 12px 20px;
      border: none;
      border-radius: 999px;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
      transition: background-color 120ms ease;
    }

    .primary-button:hover {
      background: #991B1B;
    }

    .primary-button:focus-visible,
    .skip-button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 4px;
    }

    .skip-button {
      display: block;
      width: 100%;
      min-height: 44px;
      margin-top: 5px;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    @media (max-width: 360px) {
      .page {
        padding-right: 16px;
        padding-left: 16px;
      }

      .progress-area {
        margin-top: 23px;
      }

      .intro {
        margin-top: 21px;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 25px;
      }

      .choice {
        gap: 10px;
        padding: 11px;
      }

      .actions {
        padding-top: 18px;
      }
    }

    @media (max-height: 760px) {
      .page {
        padding-top: 20px;
        padding-bottom: 16px;
      }

      .progress-area {
        margin-top: 18px;
      }

      .intro {
        margin-top: 18px;
        margin-bottom: 13px;
      }

      .selection-list {
        gap: 8px;
      }

      .choice {
        min-height: 56px;
        padding: 10px 12px;
      }

      .city-field {
        margin-top: 10px;
      }

      .actions {
        padding-top: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <p class="brand">AGILA</p>

      <section class="progress-area" aria-label="Onboarding progress">
        <p class="progress-label">Personalize your experience</p>

        <div class="progress-meta">
          <strong>Step 3 of 5</strong>
          <span>Optional</span>
        </div>

        <div class="progress-track" aria-label="3 of 5 steps">
          <span class="progress-segment active"></span>
          <span class="progress-segment active"></span>
          <span class="progress-segment active"></span>
          <span class="progress-segment"></span>
          <span class="progress-segment"></span>
        </div>
      </section>
    </header>

    <section class="intro">
      <h1>Where should we look?</h1>
      <p>Some services depend on the city or municipality where you process them.</p>
    </section>

    <form aria-label="Location preferences">
      <div class="selection-list">
        <label class="choice">
          <input type="radio" name="location-preference" value="device-location">
          <span class="choice-copy">
            <span class="choice-title">Use my location</span>
            <span class="choice-description">Use device location when available.</span>
          </span>
        </label>

        <label class="choice">
          <input type="radio" name="location-preference" value="city">
          <span class="choice-copy">
            <span class="choice-title">Enter city or municipality</span>
            <span class="choice-description">Choose the area relevant to your request.</span>
          </span>
        </label>

        <label class="choice">
          <input type="radio" name="location-preference" value="none">
          <span class="choice-copy">
            <span class="choice-title">Not now</span>
            <span class="choice-description">Continue without location preferences.</span>
          </span>
        </label>
      </div>

      <div class="city-field">
        <label for="city">City or municipality</label>
        <input
          type="text"
          id="city"
          name="city"
          placeholder="e.g., San Juan, Metro Manila"
          autocomplete="off"
        >
      </div>

      <div class="actions">
        <button class="primary-button" type="button">Continue</button>
        <button class="skip-button" type="button">Skip for now</button>
      </div>
    </form>
  </main>
</body>
</html>
